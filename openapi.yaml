  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT emitido por Keycloak. Roles: ADMIN, ANFITRION, CLIENTE.'
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret
      description: 'Secreto compartido con la pasarela de pagos.'
  schemas:
    Error:
      type: object
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          example: regla_de_negocio
        mensaje:
          type: string
    Respuesta:
      type: object
      properties:
        data:
          nullable: true
          description: 'El recurso o la lista pedida.'
