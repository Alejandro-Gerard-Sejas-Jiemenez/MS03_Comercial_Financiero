openapi: 3.0.3
info:
  title: 'MS-03 Comercial y Financiero'
  version: 1.0.0
  description: 'Pagos, reembolsos, promociones, acuerdos comerciales, comisiones y liquidaciones. Los importes viajan en centavos. Las respuestas exitosas vienen envueltas en `{data}`; los errores como `{codigo, mensaje}`.'
servers:
  -
    url: /api/v1
tags:
  -
    name: Comercial
  -
    name: Financiero
  -
    name: Monetizacion
  -
    name: Relaciones
  -
    name: Shared
paths:
  /acuerdos:
    get:
      tags:
        - Relaciones
      operationId: acuerdoControllerListar
      summary: 'Listar — AcuerdoController'
      description: 'Roles permitidos: ANFITRION, ADMIN.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: estado
          in: query
          required: false
          schema:
            type: string
            nullable: true
        -
          name: anfitrion_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
      responses:
        200:
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta'
        401:
          description: 'Falta el token o es invalido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'El rol no puede hacer esto o el recurso no es suyo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: 'Datos invalidos o regla de negocio violada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Relaciones
      operationId: acuerdoControllerCrear
      summary: 'Crear — AcuerdoController'
      description: 'Roles permitidos: ADMIN.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - anfitrion_id
                - fecha_inicio
              properties:
                anfitrion_id:
                  type: string
                  format: uuid
                fecha_inicio:
                  type: string
                  format: date-time
                fecha_fin:
                  type: string
                  format: date-time
                  nullable: true
                dias_liquidacion:
                  type: integer
                  nullable: true
                regla_comision_id:
                  type: string
                  format: uuid
                  nullable: true
                condiciones:
                  type: array
                  items:
                    type: string
                  nullable: true
      responses:
        201:
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta'
        401:
          description: 'Falta el token o es invalido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'El rol no puede hacer esto o el recurso no es suyo'
          content:
            application/json:
