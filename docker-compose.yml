# PostgreSQL local para MS-03. El puerto 5433 evita choques con un Postgres ya instalado.
#   docker compose up -d
#   php artisan migrate
services:
  postgres:
    image: postgres:16
    container_name: ms03-postgres
    environment:
      POSTGRES_DB: ms03_comercial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ms03_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ms03_comercial"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Broker de eventos (COMERCIAL_BROKER_DRIVER=rabbitmq). Consola en http://localhost:15672 (guest/guest).
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ms03-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # Solo para desarrollo: emite los JWT que MS-03 valida (KEYCLOAK_* en .env).
  # Crear el realm `alojate`, el cliente `ms03-comercial-financiero` y los
  # roles ADMIN, ANFITRION y CLIENTE desde http://localhost:8080 (admin/admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ms03-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"


  # La aplicacion. Necesita APP_KEY en el entorno: `php artisan key:generate --show`.
  #   APP_KEY=base64:... docker compose up -d --build ms03
  ms03: &ms03
    build: .
    image: ms03:local
    container_name: ms03-api
    depends_on:
      postgres:
        condition: service_healthy
    environment: &ms03_env
      APP_KEY: ${APP_KEY:-}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ms03_comercial}
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SEARCH_PATH: comercial,public
      COMERCIAL_BROKER_DRIVER: ${COMERCIAL_BROKER_DRIVER:-log}
      COMERCIAL_WEBHOOK_SECRETO: ${COMERCIAL_WEBHOOK_SECRETO:-}
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/alojate}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/alojate/protocol/openid-connect/certs}
    ports:
      - "8000:8000"

  # Relay del Outbox, vencimientos, conciliacion y liquidaciones (routes/console.php).
  scheduler:
    <<: *ms03
    container_name: ms03-scheduler
    ports: []
    healthcheck:
      disable: true
    command: ["php", "artisan", "schedule:work"]

  # Consume los eventos de MS-01 y MS-02 (necesita COMERCIAL_BROKER_DRIVER=rabbitmq).
  consumidor:
    <<: *ms03
    container_name: ms03-consumidor
    ports: []
    healthcheck:
      disable: true
    depends_on:
      - postgres
      - rabbitmq
    command: ["php", "artisan", "mensajeria:consumir"]
    restart: unless-stopped

volumes:
  ms03_pgdata:
