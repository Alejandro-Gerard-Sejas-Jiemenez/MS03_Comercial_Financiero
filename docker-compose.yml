# PostgreSQL local para MS-03. El puerto 5433 evita choques con un Postgres ya instalado.
#   docker compose up -d
#   php artisan migrate
services:
  postgres:
    image: postgres:16
    container_name: ms03-postgres
    environment:
      POSTGRES_DB: ms03_comercial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ms03_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ms03_comercial"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Solo para desarrollo: emite los JWT que MS-03 valida (KEYCLOAK_* en .env).
  # Crear el realm `alojate`, el cliente `ms03-comercial-financiero` y los
  # roles ADMIN, ANFITRION y CLIENTE desde http://localhost:8080 (admin/admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ms03-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

# RabbitMQ se agrega junto con la capa de Presentacion (consumidores y relay del
# Outbox); hoy el puerto MessageBroker usa la implementacion de log.

volumes:
  ms03_pgdata:
